; Éléa-Secours — durcissement production (OVH mutualisé, PHP 8.5)
; Ne JAMAIS afficher les erreurs PHP dans la sortie : un Warning/Deprecated/Notice
; affiché se colle en tête des réponses et casse le JSON (JSON.parse) ou met la page
; en mode quirks. Les erreurs restent journalisées (log_errors).
; NB : OVH applique .user.ini avec un cache de ~5 min (user_ini.cache_ttl).
display_errors = Off
log_errors = On
